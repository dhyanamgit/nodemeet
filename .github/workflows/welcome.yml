name: welcome
on:
  issues: { types: [opened] }
  pull_request_target: { types: [opened] }
permissions: { issues: write, pull-requests: write }
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for your first issue on nodemeet! 🎉 We'll take a look soon. Everyone who helps, bug reports included, gets credited in CONTRIBUTORS.md.
          pr-message: |
            Thanks for your first pull request to nodemeet! 🎉 Please make sure the contributor agreement line from CONTRIBUTING.md is in the description. Once it's merged you'll be added to CONTRIBUTORS.md.
