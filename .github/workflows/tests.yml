name: tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest], python: ["3.10", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e . -r tests/requirements-test.txt
      - run: ruff check .
      - run: python -m pytest tests -q -rs --ignore=tests/integration --ignore=tests/e2e
  databases:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: docker compose -f tests/integration/docker-compose.yml --profile full up -d --wait
      - run: python -m pip install -e . -r tests/integration/requirements-db.txt cassandra-driver
      - run: python -m pytest tests/integration -v -rs
  browsers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install -e . -r tests/e2e/requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m pytest tests/e2e -v -rs
