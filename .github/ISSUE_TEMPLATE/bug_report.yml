name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: And what did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Smallest code or steps that show it, render: python }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: nodemeet version, placeholder: "python -c \"import nodemeet; print(nodemeet.__version__)\"" }
  - type: input
    id: env
    attributes: { label: Python version, OS and browser }
  - type: textarea
    id: logs
    attributes: { label: Logs or browser console, render: text }
