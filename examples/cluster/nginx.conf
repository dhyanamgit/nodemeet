# Round-robin is fine for peer-to-peer rooms (Redis syncs them). For SFU/webinar
# rooms, hash on ?room= so everyone in a room lands on the same server.
upstream nodemeet {
    hash $arg_room consistent;
    server nodemeet:8080;   # docker resolves all replicas
}
server {
    listen 80;
    location / {
        proxy_pass http://nodemeet;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSockets
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
